<VirtualHost *:${PORT}>
    ServerName localhost
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public

    # Render terminates TLS before proxying the request to this container.
    # Mark forwarded HTTPS requests secure so CodeIgniter generates HTTPS URLs
    # and accepts Secure session cookies without a redirect loop.
    SetEnvIfNoCase X-Forwarded-Proto "^https$" HTTPS=on

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Uploaded content is data only. Deny script execution even if a malicious
    # file bypasses application-level image validation.
    <LocationMatch "^/uploads/.*\.(?:php|phtml|phar|cgi|pl|py|sh)$">
        Require all denied
    </LocationMatch>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined

    ServerSignature Off
</VirtualHost>
